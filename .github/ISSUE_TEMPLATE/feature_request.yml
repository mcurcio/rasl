name: Feature request
description: Ask for a new node, directive, option or behaviour.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The setup or show you are building, and what rasl cannot do for it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: |
        How it would look in a config file or on the command line. For a new directive or node,
        say what happens in the edge cases: missing values, several inputs, slices, a live reload.
      render: text
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Other configs or tools you tried, and why they fall short.
