# RASL Virtual Source/Sink Configuration
# Uses the dummy SineSourceNode and ConsoleSinkNode for hardware-free testing

rasl {
    # Dummy sine-wave source emitting DMX-shaped frames
    node SineSource sine {
        outputs 512;
        frequency_hz 1.0;
        fps 30;
        amplitude 0.5;
        offset 0.5;
        metadata "colorSpace=rgb";
    }

    # Console sink logs frames instead of sending to hardware
    node ConsoleSink console {
        input dmx;
        max_channels 24;
        include_metadata true;
    }

    # Wire dummy source directly to console sink
    edge { from sine:dmx; to console:dmx; }
}
