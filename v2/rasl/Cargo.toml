[package]
name = "rasl"
description = "Real-time Animation Show Library - CLI and runtime"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rasl"
path = "src/main.rs"

[dependencies]
rasl-core = { path = "../rasl-core" }
rasl-runtime = { path = "../rasl-runtime" }
rasl-nodes = { path = "../rasl-nodes" }
rasl-config = { path = "../rasl-config" }
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
