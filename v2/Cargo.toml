[workspace]
resolver = "2"
members = [
    "rasl-core",
    "rasl-runtime",
    "rasl-nodes",
    "rasl-config",
    "rasl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Matt Curcio <mcurcio@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/mcurcio/rasl"

[workspace.dependencies]
# Core
thiserror = "1.0"
anyhow = "1.0"

# Async
tokio = { version = "1.0", features = ["full"] }

# Numeric
ndarray = "0.16"

# Color
palette = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config parsing
nom = "7.1"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Internal crates
rasl-core = { path = "rasl-core" }
rasl-runtime = { path = "rasl-runtime" }
rasl-nodes = { path = "rasl-nodes" }
rasl-config = { path = "rasl-config" }
