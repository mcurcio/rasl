# The graph editor's browser tests start rasl on a copy of this file.
@set $rate 2;

@snippet tap $name $fps {
    node ConsoleSink $name {
        fps $fps;
        max_channels 3;
        connect rgb;
    }
}

graph {
    # a slow rainbow
    node Waveform hue {
        output_channels 30;
        fps $rate;
    }

    node Compose hsl {
        ports { h; s; l; }
        output_type color:hsl;
        connect hue h;
        fill s 1;
        fill l 0.5;
    }

    node Color rgb srgb {
        connect hsl;
    }

    node ConsoleSink console {
        fps $rate;
        max_channels 6;
        connect rgb;
    }

    @use tap probe 1;
}
