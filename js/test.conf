# Simple RASL test configuration
# Sawtooth wave output to console

graph {
    node Waveform hue_ramp {
        shape sawtooth;
        frequency_hz 0.1;
        output_channels 12;
        fps 30;
    }

    node ConsoleSink console {
        max_channels 12;
        fps 1;
        connect hue_ramp;
    }
}
