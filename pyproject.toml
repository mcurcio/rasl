[project]
name = "rasl"
version = "0.1.0"
description = "Real-time Async Streaming for Lighting - A Python data engine for DMX/sACN processing"
readme = "README.md"
authors = [
    { name = "Matt Curcio", email = "mcurcio@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.12.0",
    "colour-science>=0.4.4",
    "crossplane>=0.5.8",
    "fastapi>=0.115.0",
    "numpy>=2.3.5",
    "pydantic>=2.12.5",
    "sacn>=1.11.0",
    "strawberry-graphql[fastapi]>=0.287.3",
    "structlog>=25.5.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "pint>=0.24",
]

[project.scripts]
rasl = "rasl.cli:main"

[project.entry-points."rasl.nodes"]
builtin = "rasl.nodes"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
