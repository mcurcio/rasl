# RASL Sample Configuration
# This config mirrors the TypeScript reflector setup

rasl {
    # sACN source listens for incoming DMX data
    node SacnSource sacnSource {
        universes 1 2;
        metadata "colorSpace=rgb";
    }

    # Universe 0 patch - maps input channels to output
    node UniversePatch universePatch0 {
        output universe0;
        defaults {
            source_universe 2;
            source_channel 1;
            length 150;
        }
        segment { target_channel 1; }
        segment { target_channel 151; }
        segment { target_channel 301; }
        segment { length 62; target_channel 451; }
    }

    # sACN sink sends patched data to controller
    node SacnSink sacnSink0 {
        input universe0;
        target_host "10.0.60.30";
        target_universe 0;
        min_interval_ms 25;
    }

    # Wire up the graph
    edge { from sacnSource:dmx; to universePatch0:dmx; }
    edge { from universePatch0:universe0; to sacnSink0:universe0; }
}
