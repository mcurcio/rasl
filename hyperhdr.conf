# RASL Virtual Source/Sink Configuration
# Sawtooth-driven rainbow with TwinkleEffect transform

graph {
    # produces 149 channels
    # group 0 is 144 channels of 16x9 = 432 bytes
    # group 1 is 4 channels of 2x2 = 12 bytes
    # group 2 is 1 channel of 1x1 = 3 bytes
    
    node SacnSource hyperhdr {
        bind_port 5568;

        universe 1 {
            channels 144;  # 16x9
        }

        universe 2 {
            channels 8; # 2x4
        }
    }

    node Color hyperhdr_color rec709_rgb_prime {
        connect hyperhdr.channels;
    }

    node ConsoleSink u2_raw_console {
        fps 1;
        as_bytes true;
        connect hyperhdr_color[144:152];
    }

    node ConsoleSink u2_range_console {
        fps 1;
        as_bytes true;
        connect hyperhdr_range_map[144:152];
    }

    node ConsoleSink hyperhdr_console {
        connect hyperhdr_color;
        fps 1;
    }

    node RangeMap hyperhdr_range_map {
        ranges 0.0627 0.922;
        ranges 0.0627 0.922;
        ranges 0.0627 0.922;
        clamp true;

        connect hyperhdr_color;
    }

    node MatrixMultiply hyperhdr_matrix {
        matrix 0.96409927 0.02731212 0.00858861;
        matrix 0.00451189 1.01313961 -0.01765150;
        matrix 0.00899431 0.01377757 0.97722811;

        connect hyperhdr_range_map;
    }

    node Smooth hyperhdr_smooth {
        connect hyperhdr_matrix input;
        smooth_period 200ms;
    }

    node Color rec709_to_rgb rgb {
        connect hyperhdr_smooth;
    }

    node Color rec709_to_srgb srgb {
        connect hyperhdr_smooth;
    }

    node ConsoleSink console {
        max_channels 24;
        as_bytes true;
        fps 1;

        connect rec709_to_rgb;
    }

    node RandomMap leds_random_map {
        channel_count 2284;
        seed 424242;

        # ddp pixels (sACN universe 1)
        connect rec709_to_rgb[0:144];
    }

    node DdpSink leds {
        target "10.0.60.30";
        fps 20hz;
        input_port pixels;
        max_count 2284;

        connect leds_random_map pixels;
    }

    node LifxSink lifx_fam_fireplace_tv {
        target "10.10.59.1";
        fps 20hz;

        connect rec709_to_srgb[145:146];
    }

    node LifxSink lifx_fam_fireplace_fan {
        target "10.10.59.2";
        fps 20hz;

        connect rec709_to_srgb[147:148];
    }

    node LifxSink lifx_fam_fireplace_mid {
        target "10.10.59.3";
        fps 20hz;

        connect rec709_to_srgb[149:150];
    }

    node LifxSink lifx_fam_fireplace_kitchen {
        target "10.10.59.4";
        fps 20hz;

        connect rec709_to_srgb[151:152];
    }

    node LifxSink lifx_fam_window_tv {
        target "10.10.59.8";
        fps 20hz;

        connect rec709_to_srgb[144:145];
    }

    node LifxSink lifx_fam_window_fan {
        target "10.10.59.7";
        fps 20hz;

        connect rec709_to_srgb[146:147];
    }

    node LifxSink lifx_fam_window_mid {
        target "10.10.59.6";
        fps 20hz;

        connect rec709_to_srgb[148:149];
    }

    node LifxSink lifx_fam_window_kitchen {
        target "10.10.59.5";
        fps 20hz;

        connect rec709_to_srgb[150:151];
    }
}

